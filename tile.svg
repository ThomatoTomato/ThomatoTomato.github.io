<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <g id="sigma">
      <text x="0" y="0"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="12"
            fill="#000000"
            text-anchor="middle"
            dominant-baseline="central">Σ</text>
    </g>
  </defs>

  <!-- Connecting lines from center Pi to corner Sigmas -->
  <g stroke="#000000" stroke-width="0.9" stroke-linecap="round">
    <line x1="30" y1="30" x2="18" y2="18"/>
    <line x1="70" y1="30" x2="82" y2="18"/>
    <line x1="30" y1="70" x2="18" y2="82"/>
    <line x1="70" y1="70" x2="82" y2="82"/>
  </g>

  <!-- Center Pi -->
  <text x="50" y="50"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12"
        fill="#000000"
        text-anchor="middle"
        dominant-baseline="central">Π</text>

  <!-- Corner Sigmas (each corner shows one quarter of a Sigma) -->
  <use href="#sigma" x="0" y="0"/>
  <use href="#sigma" x="100" y="0"/>
  <use href="#sigma" x="0" y="100"/>
  <use href="#sigma" x="100" y="100"/>
</svg>
